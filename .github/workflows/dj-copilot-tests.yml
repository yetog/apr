name: DJ Copilot tests
on:
  push:
    branches: [feature/dj-copilot-sprint-1]
  pull_request:
    paths:
      - 'dj_service/**'
      - '.github/workflows/dj-copilot-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e "./dj_service[test]"
      - name: Compile
        run: python -m compileall -q dj_service/src dj_service/tests
      - name: MCP import smoke test
        run: python -c "from dj_copilot.server import mcp, health_check; assert health_check()['read_only'] is True; print('MCP import and health_check OK')"
      - name: Test
        run: cd dj_service && python -m unittest discover -s tests -v
