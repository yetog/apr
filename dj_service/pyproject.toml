[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apr-dj-copilot"
version = "0.1.0"
description = "Local-first DJ track index with MCP and loopback HTTP adapters"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0,<3", "mutagen>=1.47,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
apr-dj = "dj_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
